<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Background</title>
    <style>
        :root {
            color-scheme: dark;
            --accent-a: 84, 226, 255;
            --accent-b: 160, 88, 255;
            --glass-border: rgba(184, 220, 255, 0.18);
            --muted: rgba(220, 235, 255, 0.62);
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background: #02030a;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            user-select: none; -webkit-user-select: none;
            transition: opacity 0.8s ease;
        }

        body::before {
            content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(circle at 50% 45%, rgba(var(--accent-a), 0.065), transparent 27%),
                radial-gradient(circle at 20% 10%, rgba(var(--accent-b), 0.045), transparent 26%),
                linear-gradient(180deg, rgba(9, 13, 32, 0.24), rgba(0, 0, 0, 0.2));
            transition: background 900ms ease;
        }

        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .glass-panel {
            border: 1px solid var(--glass-border);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025)),
                rgba(3, 7, 17, 0.48);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(18px) saturate(145%);
            -webkit-backdrop-filter: blur(18px) saturate(145%);
        }

        #brand { position: fixed; top: 18px; left: 20px; z-index: 4; display: flex; align-items: center; gap: 10px; pointer-events: none; }
        #brand-mark {
            width: 9px; height: 9px; border-radius: 50%; background: rgb(var(--accent-a));
            box-shadow: 0 0 10px rgba(var(--accent-a), 0.95), 0 0 30px rgba(var(--accent-b), 0.55);
            transition: background 700ms ease, box-shadow 700ms ease;
        }
        #brand-copy { display: grid; gap: 2px; }
        #brand-title { color: rgba(245, 250, 255, 0.94); font-size: 11px; font-weight: 650; letter-spacing: 0.18em; text-transform: uppercase; }
        #brand-subtitle { color: rgba(200, 220, 245, 0.47); font-size: 9px; letter-spacing: 0.11em; text-transform: uppercase; }

        #planet-copy { position: fixed; left: clamp(20px, 4vw, 64px); bottom: clamp(104px, 13vh, 156px); z-index: 4; width: min(390px, calc(100vw - 40px)); pointer-events: none; text-shadow: 0 4px 26px rgba(0, 0, 0, 0.85); }
        #planet-kicker { margin-bottom: 7px; color: rgb(var(--accent-a)); font-size: 10px; font-weight: 650; letter-spacing: 0.22em; text-transform: uppercase; transition: color 700ms ease; }
        #planet-name { margin: 0; color: #f4f8ff; font-size: clamp(34px, 5vw, 66px); font-weight: 300; line-height: 0.94; letter-spacing: -0.045em; }
        #planet-description { max-width: 360px; margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; letter-spacing: 0.012em; }

        #transition-meter { position: relative; width: min(260px, 68vw); height: 2px; margin-top: 18px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, 0.1); opacity: 0; transform: translateY(4px); transition: opacity 280ms ease, transform 280ms ease; }
        #transition-meter.is-active { opacity: 1; transform: translateY(0); }
        #transition-meter-fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: inherit; background: linear-gradient(90deg, rgb(var(--accent-a)), rgb(var(--accent-b))); box-shadow: 0 0 14px rgba(var(--accent-a), 0.65); }

        #planet-ui { position: fixed; left: 50%; bottom: 18px; z-index: 5; display: flex; align-items: center; gap: 7px; width: max-content; max-width: calc(100vw - 24px); padding: 7px; border-radius: 16px; transform: translateX(-50%); }
        #planet-ui button { appearance: none; min-width: 96px; height: 40px; padding: 0 13px; border: 1px solid rgba(200, 225, 255, 0.13); border-radius: 11px; outline: none; color: rgba(226, 238, 255, 0.63); background: rgba(255, 255, 255, 0.035); font: 560 11px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; transition: color 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
        #planet-ui button:hover { color: rgba(255, 255, 255, 0.96); border-color: rgba(220, 240, 255, 0.26); background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); }
        #planet-ui button:focus-visible { box-shadow: 0 0 0 2px rgba(var(--accent-a), 0.38); }
        #planet-ui button.is-active { color: #ffffff; border-color: rgba(var(--accent-a), 0.48); background: linear-gradient(135deg, rgba(var(--accent-a), 0.23), rgba(var(--accent-b), 0.12)), rgba(255, 255, 255, 0.05); box-shadow: 0 0 26px rgba(var(--accent-a), 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        #planet-ui button.is-target { color: rgba(255, 255, 255, 0.96); border-color: rgba(var(--accent-b), 0.46); }

        #auto-control { position: fixed; right: 18px; top: 17px; z-index: 5; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 13px; color: rgba(219, 233, 250, 0.58); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
        #auto-control input { position: absolute; opacity: 0; pointer-events: none; }
        #auto-indicator { position: relative; width: 28px; height: 15px; border: 1px solid rgba(200, 225, 255, 0.2); border-radius: 99px; background: rgba(255, 255, 255, 0.06); transition: border-color 180ms ease, background 180ms ease; }
        #auto-indicator::after { content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: rgba(225, 238, 255, 0.52); transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease; }
        #auto-control input:checked + #auto-indicator { border-color: rgba(var(--accent-a), 0.42); background: rgba(var(--accent-a), 0.12); }
        #auto-control input:checked + #auto-indicator::after { transform: translateX(13px); background: rgb(var(--accent-a)); box-shadow: 0 0 10px rgba(var(--accent-a), 0.72); }

        @media (max-width: 760px) {
            #planet-copy { left: 18px; bottom: 126px; }
            #planet-name { font-size: clamp(38px, 12vw, 58px); }
            #planet-description { max-width: min(330px, calc(100vw - 36px)); font-size: 12px; }
            #planet-ui { bottom: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: calc(100vw - 24px); }
            #planet-ui button { min-width: 0; height: 38px; }
            #auto-control { top: 13px; right: 12px; }
        }

        /* Fade overlay for dive */
        #blackout {
            position: fixed; inset: 0; z-index: 100; background: black; opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="blackout"></div>
    <div id="canvas-container" aria-hidden="true"></div>
    <div id="brand">
        <span id="brand-mark"></span>
        <div id="brand-copy">
            <span id="brand-title">Celestial Transmutation</span>
            <span id="brand-subtitle">Realtime phase-surge synthesis</span>
        </div>
    </div>
    <label id="auto-control" class="glass-panel" title="Automatically visit the next planet">
        <span>Auto</span>
        <input id="auto-cycle" type="checkbox" checked>
        <span id="auto-indicator" aria-hidden="true"></span>
    </label>
    <section id="planet-copy" aria-live="polite">
        <div id="planet-kicker">Oceanic dreamworld</div>
        <h1 id="planet-name">Aethera</h1>
        <p id="planet-description">A luminous water planet whose equatorial currents fold into violet auroras and suspended atmospheric rivers.</p>
        <div id="transition-meter" aria-hidden="true"><div id="transition-meter-fill"></div></div>
    </section>
    <nav id="planet-ui" class="glass-panel" aria-label="Conceptual planets">
        <button type="button" class="is-active" data-planet="0" aria-pressed="true">Aethera</button>
        <button type="button" data-planet="1" aria-pressed="false">Pyra</button>
        <button type="button" data-planet="2" aria-pressed="false">Orison</button>
        <button type="button" data-planet="3" aria-pressed="false">Vesper</button>
    </nav>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- GLOBAL API FOR PANELS ---
        window.startDive = (onComplete) => {
            document.getElementById('blackout').style.opacity = '1';
            setTimeout(() => {
                if(onComplete) onComplete();
            }, 800);
        };

        window.resetDive = () => {
            document.getElementById('blackout').style.opacity = '1';
            setTimeout(() => {
                document.getElementById('blackout').style.opacity = '0';
            }, 800);
        };
        // -----------------------------

        const PLANETS = [
            { name: 'Aethera', kicker: 'Oceanic dreamworld', description: 'A luminous water planet whose equatorial currents fold into violet auroras and suspended atmospheric rivers.', accentA: '84, 226, 255', accentB: '160, 88, 255' },
            { name: 'Pyra', kicker: 'Living furnace world', description: 'A carbon-black planet split by molten tectonic calligraphy, with incandescent matter breathing through every fracture.', accentA: '255, 132, 44', accentB: '255, 45, 86' },
            { name: 'Orison', kicker: 'Sacred ring architecture', description: 'A pearl-and-teal giant encircled by a vast luminous archive: billions of particles arranged like celestial sheet music.', accentA: '255, 220, 142', accentB: '74, 232, 210' },
            { name: 'Vesper', kicker: 'Crystalline night engine', description: 'A faceted violet world that stores starlight inside geometric continents and releases it through cyan polar seams.', accentA: '177, 116, 255', accentB: '76, 230, 255' }
        ];

        const TAU = Math.PI * 2;
        const isCompact = window.matchMedia('(max-width: 760px)').matches;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const container = document.getElementById('canvas-container');
        const planetButtons = Array.from(document.querySelectorAll('[data-planet]'));
        const planetName = document.getElementById('planet-name');
        const planetKicker = document.getElementById('planet-kicker');
        const planetDescription = document.getElementById('planet-description');
        const transitionMeter = document.getElementById('transition-meter');
        const transitionMeterFill = document.getElementById('transition-meter-fill');
        const autoCycleInput = document.getElementById('auto-cycle');

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });

        function responsivePixelRatio() { const cap = isCompact ? 1.45 : 1.85; return Math.min(window.devicePixelRatio || 1, cap); }
        function responsiveCameraZ() { const aspect = window.innerWidth / window.innerHeight; if (aspect < 0.66) return 10.6; if (aspect < 0.95) return 9.55; return 8.55; }

        renderer.setPixelRatio(responsivePixelRatio());
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x02030a, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02030a, 0.015);
        const camera = new THREE.PerspectiveCamera(39, window.innerWidth / window.innerHeight, 0.08, 90);
        camera.position.set(0, 0.25, responsiveCameraZ());

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.045; controls.enablePan = false; controls.enableZoom = true; controls.zoomSpeed = 0.72; controls.minDistance = 6.25; controls.maxDistance = 12.75; controls.minPolarAngle = Math.PI * 0.16; controls.maxPolarAngle = Math.PI * 0.84; controls.autoRotate = !prefersReducedMotion; controls.autoRotateSpeed = 0.24; controls.target.set(0, 0.02, 0); controls.update();

        const guardedCameraOffset = new THREE.Vector3();
        let intendedOrbitRadius = THREE.MathUtils.clamp(camera.position.distanceTo(controls.target), controls.minDistance, controls.maxDistance);
        let manualZoomCaptureFrames = 0;

        function beginManualZoomCapture(frameCount = 12) { manualZoomCaptureFrames = Math.max(manualZoomCaptureFrames, frameCount); }
        renderer.domElement.addEventListener('wheel', () => beginManualZoomCapture(14), { passive: true, capture: true });
        
        function guardOrbitRadius() {
            guardedCameraOffset.copy(camera.position).sub(controls.target);
            let currentRadius = guardedCameraOffset.length();
            if (!Number.isFinite(currentRadius) || currentRadius < 1.0e-6) { guardedCameraOffset.set(0, 0.23, 1).normalize(); currentRadius = intendedOrbitRadius; }
            if (manualZoomCaptureFrames > 0) { intendedOrbitRadius = THREE.MathUtils.clamp(currentRadius, controls.minDistance, controls.maxDistance); manualZoomCaptureFrames -= 1; return; }
            if (Math.abs(currentRadius - intendedOrbitRadius) > 1.0e-5) { guardedCameraOffset.multiplyScalar(1 / currentRadius); camera.position.copy(controls.target).addScaledVector(guardedCameraOffset, intendedOrbitRadius); camera.lookAt(controls.target); }
        }

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.50, 0.30, 0.50);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        const noiseGLSL = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float saturate(float value) { return clamp(value, 0.0, 1.0); }
        vec2 safeNormalize(vec2 value) { return value * inversesqrt(max(dot(value, value), 1.0e-12)); }
        vec3 safeNormalize(vec3 value) { return value * inversesqrt(max(dot(value, value), 1.0e-12)); }
        float safeAtan(float y, float x) { bool nearOrigin = abs(x) + abs(y) < 1.0e-7; return nearOrigin ? 0.0 : atan(y, x); }
        float sanitizeFloat(float value, float fallbackValue) { bool valid = value == value && abs(value) < 1.0e5; return valid ? value : fallbackValue; }
        vec3 sanitizeVec3(vec3 value, vec3 fallbackValue) { bool invalid = any(notEqual(value, value)) || any(greaterThan(abs(value), vec3(1.0e5))); return invalid ? fallbackValue : value; }
        vec3 limitLuminance(vec3 color, float maximumLuminance) { vec3 safeColor = max(sanitizeVec3(color, vec3(0.0)), vec3(0.0)); float luminance = dot(safeColor, vec3(0.2126, 0.7152, 0.0722)); float scale = min(1.0, maximumLuminance / max(luminance, 1.0e-5)); return safeColor * scale; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx; vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_); vec4 x = x_ * ns.x + ns.yyyy; vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y); vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0) * 2.0 + 1.0; vec4 s1 = floor(b1) * 2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m *= m;
            return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }
        mat2 rotate2D(float angle) { float s = sin(angle); float c = cos(angle); return mat2(c, -s, s, c); }
        mat3 rotateX3(float angle) { float s = sin(angle); float c = cos(angle); return mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c); }
        mat3 rotateZ3(float angle) { float s = sin(angle); float c = cos(angle); return mat3(c, -s, 0.0, s, c, 0.0, 0.0, 0.0, 1.0); }
        `;

        const planetFunctionsGLSL = `
        const float PI = 3.141592653589793; const float TWO_PI = 6.283185307179586;
        float isPreset(float preset, float expected) { return 1.0 - step(0.5, abs(preset - expected)); }
        vec3 aetheraPosition(vec3 seed, vec4 randomData, float time) { vec3 direction = safeNormalize(seed); float latitude = asin(clamp(direction.y, -1.0, 1.0)); float continent = snoise(direction * 2.45 + vec3(0.0, time * 0.018, 0.0)); float currentNoise = snoise(direction * 4.2 + vec3(time * 0.045, -time * 0.018, time * 0.032)); float current = sin(latitude * 10.5 + dot(direction, safeNormalize(vec3(0.74, 0.11, 0.66))) * 5.4 + currentNoise * 1.35 - time * 0.18); float radius = 2.08 + continent * 0.072 + current * 0.026; vec3 p = direction * radius; p.y *= 0.975; p.xz = rotate2D(sin(latitude * 3.0 + time * 0.08) * 0.018) * p.xz; return p; }
        vec3 pyraPosition(vec3 seed, vec4 randomData, float time) { vec3 direction = safeNormalize(seed); float terrain = snoise(direction * 3.4 + vec3(time * 0.012, 0.0, 0.0)); float secondary = snoise(direction * 8.0 - vec3(0.0, time * 0.024, 0.0)); float moltenLift = pow(max(secondary * 0.5 + 0.5, 0.0), 8.0); float radius = 2.08 + terrain * 0.125 + moltenLift * 0.090; return direction * radius; }
        vec3 orisonBodyPosition(vec3 seed, vec4 randomData, float time) { vec3 direction = safeNormalize(seed); float latitude = asin(clamp(direction.y, -1.0, 1.0)); float bandNoise = snoise(direction * vec3(2.2, 5.8, 2.2) + vec3(time * 0.018, -time * 0.012, time * 0.014)); float band = sin(latitude * 18.0 + bandNoise * 1.8 + time * 0.06); float storm = snoise(direction * 4.15 + vec3(-time * 0.021, time * 0.013, time * 0.026)); float radius = 2.07 + band * 0.020 + storm * 0.038; vec3 p = direction * radius; p.y *= 0.945; return p; }
        vec3 orisonRingPosition(vec3 seed, vec4 randomData, float time) { float radius = mix(2.18, 3.62, pow(randomData.x, 0.74)); float angle = randomData.y * TWO_PI + time * (0.018 + randomData.w * 0.012); float lane = floor(randomData.z * 11.0) / 11.0; float gap = 0.92 + 0.08 * sin(lane * 71.0 + randomData.w * 16.0); radius *= gap; float vertical = (randomData.z - 0.5) * 0.115; vertical += snoise(vec3(cos(angle) * 2.1, sin(angle) * 2.1, radius * 1.7)) * 0.035; vec3 p = vec3(cos(angle) * radius, vertical, sin(angle) * radius); p = rotateZ3(0.34) * rotateX3(0.20) * p; return p; }
        vec3 vesperPosition(vec3 seed, vec4 randomData, float time) { vec3 direction = safeNormalize(seed); vec3 stepped = floor(direction * 7.0 + 0.5) / 7.0; vec3 facetedDirection = safeNormalize(mix(direction, stepped, 0.68)); float cell = snoise(facetedDirection * 4.8); vec3 axisA = safeNormalize(vec3(0.82, 0.31, 0.48)); vec3 axisB = safeNormalize(vec3(-0.24, 0.91, 0.34)); vec3 axisC = safeNormalize(vec3(0.41, -0.17, 0.90)); float lattice = sin(dot(facetedDirection, axisA) * 18.0) * sin(dot(facetedDirection, axisB) * 16.0) * sin(dot(facetedDirection, axisC) * 14.0); float seam = pow(abs(lattice), 5.5); float radius = 2.06 + cell * 0.145 + seam * 0.070; vec3 p = facetedDirection * radius; p.y *= 1.018; return p; }
        vec3 planetPosition(float preset, vec3 seed, vec4 randomData, float kind, float time) { if (preset < 0.5) return aetheraPosition(seed, randomData, time); if (preset < 1.5) return pyraPosition(seed, randomData, time); if (preset < 2.5) { return kind > 0.5 ? orisonRingPosition(seed, randomData, time) : orisonBodyPosition(seed, randomData, time); } return vesperPosition(seed, randomData, time); }
        vec3 aetheraColor(vec3 p, vec3 seed, vec4 randomData, float time) { vec3 direction = safeNormalize(seed); float latitude = asin(clamp(direction.y, -1.0, 1.0)); float current = snoise(direction * 3.65 + vec3(-time * 0.055, time * 0.025, time * 0.04)); float ribbonNoise = snoise(direction * 6.8 + vec3(time * 0.025, -time * 0.06, time * 0.015)); float auroraWave = sin(latitude * 8.2 + dot(direction, safeNormalize(vec3(0.71, -0.08, 0.70))) * 7.1 + ribbonNoise * 1.8 - time * 0.35); float aurora = pow(max(0.0, auroraWave), 5.0); float polar = smoothstep(0.48, 0.93, abs(direction.y)); vec3 abyss = vec3(0.004, 0.028, 0.13); vec3 ocean = vec3(0.012, 0.34, 0.78); vec3 cyan = vec3(0.05, 0.95, 1.25); vec3 violet = vec3(0.58, 0.08, 1.05); vec3 color = mix(abyss, ocean, current * 0.5 + 0.5); color = mix(color, cyan, smoothstep(0.22, 0.80, current) * 0.55); color += mix(cyan, violet, polar) * aurora * (0.28 + polar * 0.62); color += vec3(0.08, 0.28, 0.52) * pow(max(0.0, snoise(direction * 9.0)), 5.0); return limitLuminance(color, 1.38); }

        vec3 orisonColor(vec3 p, vec3 seed, vec4 randomData, float kind, float time) { if (kind > 0.5) { float ringRadius = length(p.xz); float lane = sin(ringRadius * 27.0 + randomData.w * 7.0); float dust = snoise(vec3(cos(randomData.y * TWO_PI) * 2.2, sin(randomData.y * TWO_PI) * 2.2, ringRadius * 3.7)); vec3 antiqueGold = vec3(0.95, 0.52, 0.12); vec3 mineralTeal = vec3(0.05, 0.76, 0.66); vec3 duskViolet = vec3(0.33, 0.08, 0.55); vec3 color = mix(antiqueGold, mineralTeal, lane * 0.5 + 0.5); color = mix(color, duskViolet, smoothstep(0.50, 0.88, dust) * 0.42); return limitLuminance(color, 1.12); } vec3 direction = safeNormalize(seed); float latitude = asin(clamp(direction.y, -1.0, 1.0)); float latitudeMask = abs(latitude) / (PI * 0.5); float broadFlow = snoise(direction * 2.45 + vec3(time * 0.014, -time * 0.01, time * 0.018)); float fineFlow = snoise(direction * 7.2 + vec3(-time * 0.032, time * 0.012, time * 0.024)); float band = sin(latitude * 18.0 + broadFlow * 2.4 + fineFlow * 0.55 + time * 0.045); float storm = snoise(direction * 4.3 + vec3(time * 0.025, time * 0.012, -time * 0.018)); float stormCell = smoothstep(0.34, 0.88, storm) * (1.0 - smoothstep(0.72, 1.0, latitudeMask)); vec3 midnight = vec3(0.012, 0.028, 0.085); vec3 bronze = vec3(0.58, 0.25, 0.055); vec3 pearl = vec3(0.82, 0.76, 0.50); vec3 deepTeal = vec3(0.012, 0.38, 0.46); vec3 jade = vec3(0.035, 0.86, 0.66); float brightBand = smoothstep(-0.30, 0.88, band); vec3 color = mix(midnight, bronze, broadFlow * 0.5 + 0.5); color = mix(color, pearl, brightBand * 0.48); color = mix(color, deepTeal, smoothstep(0.06, 0.74, fineFlow) * 0.62); color += jade * stormCell * 0.62; color *= mix(1.0, 0.78, smoothstep(0.65, 1.0, latitudeMask)); return limitLuminance(color, 1.32); }

        `;

        const sharedPlanetUniforms = { uTime: { value: 0 }, uFromPreset: { value: 0 }, uToPreset: { value: 0 }, uTransition: { value: 0 }, uTransitionEnergy: { value: 0 } };

        const nebulaGeometry = new THREE.SphereGeometry(45, 48, 32);
        const nebulaMaterial = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: `varying vec3 vDirection; void main() { vDirection = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `${noiseGLSL} uniform float uTime; varying vec3 vDirection; void main() { vec3 direction = safeNormalize(vDirection); float broad = snoise(direction * 1.7 + vec3(0.0, uTime * 0.006, 0.0)); float filaments = snoise(direction * 4.0 - vec3(uTime * 0.004, 0.0, 0.0)); float cloud = smoothstep(0.12, 0.88, broad * 0.7 + filaments * 0.3); float horizon = pow(max(1.0 - abs(direction.y), 0.0), 4.0); vec3 midnight = vec3(0.0015, 0.002, 0.009); vec3 blue = vec3(0.018, 0.038, 0.10); vec3 violet = vec3(0.055, 0.018, 0.10); vec3 color = midnight; color += mix(blue, violet, filaments * 0.5 + 0.5) * cloud * horizon * 0.62; gl_FragColor = vec4(color, 1.0); }`,
            side: THREE.BackSide, depthWrite: false, fog: false
        });
        const nebula = new THREE.Mesh(nebulaGeometry, nebulaMaterial); scene.add(nebula);

        const planetGroup = new THREE.Group(); planetGroup.rotation.z = -0.055; scene.add(planetGroup);
        const surfaceGeometry = new THREE.IcosahedronGeometry(1, isCompact ? 5 : 6);
        const surfaceMaterial = new THREE.ShaderMaterial({
            uniforms: sharedPlanetUniforms,
            vertexShader: `
                ${noiseGLSL} ${planetFunctionsGLSL}
                uniform float uTime; uniform float uFromPreset; uniform float uToPreset; uniform float uTransition; uniform float uTransitionEnergy;
                varying vec3 vWorldPosition; varying vec3 vObjectPosition; varying vec3 vSeed; varying vec3 vNormalApprox; varying float vLocalMorph; varying float vScanFront; varying float vSweepCoordinate;
                float phaseCoordinate(vec3 seed, float time) { vec3 axisA = safeNormalize(vec3(0.82, 0.25, 0.52)); vec3 axisB = safeNormalize(vec3(-0.18, 0.93, 0.32)); float coordinate = dot(seed, axisA); coordinate += sin(dot(seed, axisB) * 6.2 - time * 0.72) * 0.055; coordinate += snoise(seed * 3.4 + vec3(0.0, time * 0.10, 0.0)) * 0.035; return coordinate; }
                void main() {
                    vec3 seed = safeNormalize(position); vec4 randomData = vec4(fract(sin(dot(seed.xy, vec2(12.9898, 78.233))) * 43758.5453), fract(sin(dot(seed.yz, vec2(39.3468, 11.135))) * 24634.6345), fract(sin(dot(seed.zx, vec2(73.156, 52.235))) * 56445.234), fract(sin(dot(seed.xyz, vec3(19.19, 7.17, 41.73))) * 9531.317));
                    vec3 fromPosition = sanitizeVec3(planetPosition(uFromPreset, seed, randomData, 0.0, uTime), seed * 2.08); vec3 toPosition = sanitizeVec3(planetPosition(uToPreset, seed, randomData, 0.0, uTime), seed * 2.08);
                    float coordinate = phaseCoordinate(seed, uTime); float scanPosition = mix(-1.24, 1.24, uTransition); float scanWidth = 0.115; float localMorph = 1.0 - smoothstep(scanPosition - scanWidth, scanPosition + scanWidth, coordinate); float front = exp(-abs(coordinate - scanPosition) * 19.0); float coreFront = exp(-abs(coordinate - scanPosition) * 42.0);
                    vec3 objectPosition = mix(fromPosition, toPosition, localMorph); vec3 normalDirection = safeNormalize(objectPosition); vec3 phaseAxis = safeNormalize(vec3(0.82, 0.25, 0.52)); vec3 tangent = safeNormalize(cross(normalDirection, phaseAxis + vec3(0.001, 0.002, 0.003))); float ripple = sin(dot(seed, safeNormalize(vec3(-0.31, 0.79, 0.53))) * 22.0 - uTime * 5.2); objectPosition += normalDirection * front * (0.052 + ripple * 0.022); objectPosition += tangent * coreFront * ripple * 0.028; objectPosition = sanitizeVec3(objectPosition, seed * 2.08);
                    vec4 worldPosition = modelMatrix * vec4(objectPosition, 1.0); gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    vWorldPosition = worldPosition.xyz; vObjectPosition = objectPosition; vSeed = seed; vNormalApprox = safeNormalize(mat3(modelMatrix) * objectPosition); vLocalMorph = localMorph; vScanFront = front; vSweepCoordinate = coordinate;
                }
            `,
            fragmentShader: `
                ${noiseGLSL} ${planetFunctionsGLSL}
                uniform float uTime; uniform float uFromPreset; uniform float uToPreset; uniform float uTransition; uniform float uTransitionEnergy;
                varying vec3 vWorldPosition; varying vec3 vObjectPosition; varying vec3 vSeed; varying vec3 vNormalApprox; varying float vLocalMorph; varying float vScanFront; varying float vSweepCoordinate;
                void main() {
                    vec4 randomData = vec4(fract(sin(dot(vSeed.xy, vec2(12.9898, 78.233))) * 43758.5453), fract(sin(dot(vSeed.yz, vec2(39.3468, 11.135))) * 24634.6345), fract(sin(dot(vSeed.zx, vec2(73.156, 52.235))) * 56445.234), fract(sin(dot(vSeed.xyz, vec3(19.19, 7.17, 41.73))) * 9531.317));

                }

        });
        const surfaceMesh = new THREE.Mesh(surfaceGeometry, surfaceMaterial); surfaceMesh.renderOrder = 2; planetGroup.add(surfaceMesh);

        const transitionState = { active: false, from: 0, to: 0, queued: null, startTime: 0, duration: prefersReducedMotion ? 0.82 : 1.28, raw: 0, eased: 0, energy: 0, current: 0, settledAt: 0 };
        function smootherStep(value) { const x = THREE.MathUtils.clamp(value, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); }
        function cinematicEase(value) { const x = THREE.MathUtils.clamp(value, 0, 1); if (x < 0.5) return 0.5 * Math.pow(x * 2, 1.22); return 1 - 0.5 * Math.pow((1 - x) * 2, 1.22); }
        function transitionEnergy(easedProgress) { const progress = THREE.MathUtils.clamp(easedProgress, 0, 1); const pulse = Math.max(0, Math.sin(Math.PI * progress)); const energy = Math.pow(pulse, 1.35); return Number.isFinite(energy) ? energy : 0; }
        function setSharedUniform(name, value) { sharedPlanetUniforms[name].value = value; }

        function updatePlanetCopy(index, isTransmuting = false) { const planet = PLANETS[index]; planetKicker.textContent = isTransmuting ? \`Phasing into \${planet.kicker.toLowerCase()}\` : planet.kicker; planetName.textContent = planet.name; planetDescription.textContent = planet.description; }
        function updateButtonState(currentIndex, targetIndex = null) { planetButtons.forEach((button) => { const index = Number(button.dataset.planet); const isCurrent = index === currentIndex && targetIndex === null; const isTarget = targetIndex !== null && index === targetIndex; button.classList.toggle('is-active', isCurrent); button.classList.toggle('is-target', isTarget); button.setAttribute('aria-pressed', String(isCurrent || isTarget)); }); }

            if (!transitionState.active) return;
            const raw = THREE.MathUtils.clamp((nowSeconds - transitionState.startTime) / transitionState.duration, 0, 1); const eased = cinematicEase(raw); const energy = transitionEnergy(eased);
            transitionState.raw = raw; transitionState.eased = eased; transitionState.energy = energy;
            setSharedUniform('uTransition', eased); setSharedUniform('uTransitionEnergy', energy); transitionMeterFill.style.width = \`\${(raw * 100).toFixed(2)}%\`;
            if (raw >= 1) settleTransition(nowSeconds);
        }

        let latestTime = 0;
        planetButtons.forEach((button) => { button.addEventListener('click', () => { beginTransition(Number(button.dataset.planet), latestTime); }); });
        
        function handleResize() { const width = window.innerWidth; const height = window.innerHeight; const pixelRatio = responsivePixelRatio(); camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setPixelRatio(pixelRatio); renderer.setSize(width, height); composer.setPixelRatio(pixelRatio); composer.setSize(width, height); }
        window.addEventListener('resize', handleResize, { passive: true });

        const clock = new THREE.Clock(); transitionState.settledAt = 0; const AUTO_HOLD_SECONDS = prefersReducedMotion ? 6.0 : 4.2;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.04); const time = clock.elapsedTime; latestTime = time; updateTransition(time);
            const energy = transitionState.energy; surfaceMaterial.depthWrite = true;
            sharedPlanetUniforms.uTime.value = time; nebulaMaterial.uniforms.uTime.value = time;
            planetGroup.rotation.y += (0.035 + energy * 0.12) * delta; planetGroup.rotation.x = Math.sin(time * 0.12) * 0.025; planetGroup.scale.set(1.0, 1.0, 1.0);
            nebula.rotation.y = -time * 0.00045;
            bloomPass.strength = 0.50 + energy * 0.055; bloomPass.radius = 0.30 + energy * 0.025; bloomPass.threshold = 0.50 + energy * 0.025; renderer.toneMappingExposure = 1.08;
            if (autoCycleInput.checked && !transitionState.active && time - transitionState.settledAt > AUTO_HOLD_SECONDS) { beginTransition(transitionState.current + 1, time); }
            controls.update(); guardOrbitRadius(); composer.render();
        }

        setDocumentAccent(0); updatePlanetCopy(0, false); updateButtonState(0, null); handleResize(); animate();
